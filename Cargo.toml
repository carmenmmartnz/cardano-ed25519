[package]
name = "cardano-ed25519"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
bip39 = "2"
curve25519-dalek = "4"
hex = "0.4"

# Cross-checks our signatures against an independent Ed25519 implementation.
[dev-dependencies]
ed25519-dalek = "2"

# Only pulled in for the browser build (`web/`); the native binary and
# `cargo test` never compile these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
